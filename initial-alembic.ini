# Initial (baseline) Alembic environment: schema creation + essential seed data.
#
#   alembic -c initial-alembic.ini upgrade head
#   alembic -c initial-alembic.ini downgrade base


[alembic]
script_location = %(here)s/migrations
version_locations = %(here)s/migrations/initial_versions
path_separator = os
version_table = initial_alembic_version
prepend_sys_path = .


# Database URL. This's consumed by the user-maintained env.py script only.
# other means of configuring database URLs may be customized within the env.py
# file.
# NOTE:
# While hard-coded the value here works great in a development environment,
# this's basically exposing the connection method to shutdown the whole database
# in production environment. Therefore, depends on your use case, define it
# wisely. We'll default to set it as if we're running migration scripts on
# production (which normally why this kind of tool exists for).
# sqlalchemy.url = driver://user:pass@localhost/dbname


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
