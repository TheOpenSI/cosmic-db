[project]
name = "CoSMIC-Backend"
version = "1.0.0"
description = "Cognitive System of Machine Intelligent Computing (backend system)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.129.0",
    # NOTE: Use 'psycopg[binary]' version on production.
    "psycopg>=3.3.3",
    "sqlmodel>=0.0.37",
    # NOTE: Used to detect near-miss (e.g. L337) immutable field value mimicry.
    "rapidfuzz>=3.14.5",
]


[dependency-groups]
dev = [
    "faker>=37.0.0",
]
